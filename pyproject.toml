[project]
name = "jobtrack"
version = "0.1.0"
description = "A helper to scrape & track jobs"
readme = "README.md"
license = "MIT"
authors = [
    { name = "HeftyB", email = "heftyb@heftyb.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.29.2",
]

[project.scripts]
jobtrack = "jobtrack.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
